name: Daily Carousel Post

on:
  # Daily at 9am IST (3:30 UTC)
  schedule:
    - cron: '30 3 * * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:
  # Triggered by Cloudflare Worker on /reject or /skip
  repository_dispatch:
    types: [regenerate, skip]

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Handle skip
        if: github.event.action == 'skip'
        run: |
          python - << 'PYEOF'
          import json
          with open("chokepoints.json") as f:
              db = json.load(f)
          # Mark the current generated entry as skipped
          for e in db:
              if e.get("post_status") == "generated":
                  e["post_status"] = "skipped"
                  print(f"Skipped: {e['name']}")
                  break
          with open("chokepoints.json", "w") as f:
              json.dump(db, f, indent=2)
          PYEOF

      - name: Commit skip if needed
        if: github.event.action == 'skip'
        run: |
          git config user.name "chokepoints-bot"
          git config user.email "bot@chokepoints.world"
          git add chokepoints.json
          git diff --staged --quiet || git commit -m "skipped entry"
          git push

      - name: Run scheduler
        if: github.event.action != 'skip'
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:      ${{ secrets.TELEGRAM_CHAT_IDS }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:            ${{ github.repository }}
        run: python scheduler.py

      - name: Commit updated chokepoints.json
        if: github.event.action != 'skip'
        run: |
          git config user.name "chokepoints-bot"
          git config user.email "bot@chokepoints.world"
          git add chokepoints.json pending_post.json
          git diff --staged --quiet || git commit -m "generated: $(date +%Y-%m-%d)"
          git push
